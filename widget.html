          addInactive(sw0.upperLeft, sw0.output); addActive(sw0.upperRight, sw0.output, output[j0]);
          addActive(sw1.upperLeft, sw1.output, output[j1]); addInactive(sw1.upperRight, sw1.output);
        }
        addActive(sw0.output, vg.stageOutputNodes[s][j0], output[j0]);
        addActive(sw1.output, vg.stageOutputNodes[s][j1], output[j1]);
      }
    }
    const finalLayer = state.layers[state.n];
    for (let j = 0; j < state.N; j++) addActive(vg.finalSources[j], vg.outputPorts[j], finalLayer[j]);
    return { inactive, one, zero, tri, shaded };
  }

  function drawMotionGuides(ctx, g) {
    if (!el.pairArcs.checked) return;
    ctx.save();
    ctx.strokeStyle = '#17945d';
    ctx.lineWidth = 1.4;
    ctx.globalAlpha = 0.72;
    for (let s = 0; s < state.n; s++) for (let q = 0; q < state.N / 2; q++) {
      const j0 = rotL(2*q, s, state.n), j1 = rotL(2*q+1, s, state.n);
      const a = state.positions[s][j0], b = state.positions[s][j1];
      const separation = dist(a, b);
      if (separation < 0.5) continue;
      const depth = 12 + 8 * Math.sqrt(separation / g.dx);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.quadraticCurveTo((a.x+b.x)/2, Math.max(a.y,b.y)+depth, b.x, b.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawMotionBack(ctx, g, vg) {
    ctx.save();
    ctx.fillStyle = 'rgba(255,255,255,0.83)';
    for (let s=0;s<state.n;s++) for (let j=0;j<state.N;j++) {
      const c=vg.switchGeom[s][j].center;
      ctx.beginPath(); ctx.arc(c.x,c.y,g.r,0,Math.PI*2); ctx.fill();
    }
    ctx.restore();

    const paths = buildCanvasRoutePaths(g, vg);
    ctx.save();
    ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.setLineDash([2.6,4.2]); ctx.strokeStyle='#8c96a8'; ctx.lineWidth=1.35; ctx.globalAlpha=1; ctx.stroke(paths.inactive);
    ctx.setLineDash([]);
    if (el.shades.checked) {
      for (let origin=0; origin<state.N; origin++) {
        const sig=state.inputs[origin], path=paths.shaded[origin];
        ctx.globalAlpha=sig.value===2?0.62:(sig.value===1?0.42:0.48);
        ctx.strokeStyle=signalGlowColor(sig); ctx.lineWidth=sig.value===2?8.5:(sig.value===1?6.2:6.5);
        if (sig.value===2) { ctx.shadowColor=signalGlowColor(sig); ctx.shadowBlur=2.2; }
        ctx.stroke(path); ctx.shadowBlur=0;
      }
      ctx.globalAlpha=1; ctx.lineWidth=1.65;
      for (let origin=0; origin<state.N; origin++) { ctx.strokeStyle=signalCoreColor(state.inputs[origin]); ctx.stroke(paths.shaded[origin]); }
    } else {
      ctx.globalAlpha=0.42; ctx.strokeStyle='#87d7ff'; ctx.lineWidth=6.2; ctx.stroke(paths.one);
      ctx.globalAlpha=0.48; ctx.strokeStyle='#ffc75e'; ctx.lineWidth=6.5; ctx.stroke(paths.zero);
      ctx.globalAlpha=0.62; ctx.strokeStyle='#c8ced8'; ctx.lineWidth=8.5; ctx.shadowColor='#c8ced8'; ctx.shadowBlur=2.2; ctx.stroke(paths.tri);
      ctx.shadowBlur=0; ctx.globalAlpha=1;
      ctx.strokeStyle='#236f9d'; ctx.lineWidth=1.65; ctx.stroke(paths.one);
      ctx.strokeStyle='#9a4a22'; ctx.stroke(paths.zero);
      ctx.strokeStyle='#727b89'; ctx.stroke(paths.tri);
    }
    ctx.restore();
  }

  function drawMotionFront(ctx, g, vg) {
    ctx.save();
    ctx.lineCap='round'; ctx.lineJoin='round';
    for (let s=0;s<state.n;s++) for (let j=0;j<state.N;j++) {
      const sw=vg.switchGeom[s][j], pass=state.pairState[s][sw.q]===0;
      const selectedPort = sw.side===0 ? (pass?sw.upperLeft:sw.upperRight) : (pass?sw.upperRight:sw.upperLeft);
      const inactivePort = selectedPort===sw.upperLeft ? sw.upperRight : sw.upperLeft;
      const j0=rotL(2*sw.q,s,state.n), j1=rotL(2*sw.q+1,s,state.n);
      const selectedInputJ = sw.side===0 ? (pass?j0:j1) : (pass?j1:j0);
      const selectedSig=state.layers[s][selectedInputJ], outputSig=state.layers[s+1][j];
      canvasCircle(ctx,sw.center.x,sw.center.y,g.r,null,'#303b4d',1.35);
      const selectedColor=signalCoreColor(selectedSig);
      const outputColor=signalCoreColor(outputSig);
      canvasCircle(ctx,selectedPort.x,selectedPort.y,2.5,selectedColor,'white',0.75);
      canvasCircle(ctx,inactivePort.x,inactivePort.y,2.35,'white','#8c96a8',1);
      canvasCircle(ctx,sw.output.x,sw.output.y,2.6,outputColor,'white',0.75);
      if (el.switchLabels.checked) {
        const size=clamp(g.dx*0.16,6.2,9);
        const x=sw.output.x+(sw.side===0?-4.5:4.5), y=sw.output.y+2.8;
        ctx.font=`700 ${size}px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif`;
        ctx.textAlign=sw.side===0?'right':'left'; ctx.textBaseline='alphabetic';
        ctx.lineWidth=2.4; ctx.strokeStyle='white'; ctx.strokeText(outputSig.label,x,y);
        ctx.fillStyle='#263246'; ctx.fillText(outputSig.label,x,y);
      }
    }
    ctx.restore();
  }

  function renderMotionFrame(now = performance.now()) {
    if (!state.motion || state.boxAnimation || (state.boxProgress > 0.001 && state.boxProgress < 0.999) || typeof Path2D === 'undefined') return false;
    const g=geometry(), vg=visualGeometry(g);
    const switchHits=el.svg.querySelectorAll('#hitTargets .hit[data-type="switch"]');
    if (!el.motionGuideCanvas || !el.motionCanvas || !el.motionOverlay || switchHits.length!==state.n*state.N) return false;

    for (const selector of ['#switchBacks','#inactiveRoutes','#signalGlows','#signalCores','#switchFronts']) {
      const node=el.svg.querySelector(selector); if (node) node.style.visibility='hidden';
    }
    const guides=el.svg.querySelector('#guides'); if (guides) guides.style.visibility='hidden';
    if (el.motionCanvas.style.display !== 'block') prepareMotionOverlay();
    el.motionGuideCanvas.style.display='block';
    el.motionCanvas.style.display='block';
    el.motionOverlay.style.display='block';

    drawMotionGuides(motionCanvasContext(el.motionGuideCanvas,g),g);
    const ctx = motionCanvasContext(el.motionCanvas,g);
    drawMotionBack(ctx,g,vg);
    drawMotionFront(ctx,g,vg);
    updatePermutationReadouts(el.motionOverlay);

    for (const hit of switchHits) hit.style.pointerEvents='none';
    const statusKey = state.motion.cycles ? state.motion.cycleIndex : -1;
    if (state.motion.lastStatusKey !== statusKey) {
      state.motion.lastStatusKey = statusKey;
      updateStatus();
      updateLayoutButtons();
    }
    return true;
  }

  function render(now = performance.now()) {
    if (renderMotionFrame(now)) return;
    deactivateMotionSurfaces();
    fullRender(now);
  }

  function updateLayoutButtons() {
    const effective = state.motion ? state.motion.targetLayout : state.layout;
    for (const [button, name] of [[el.butterfly, 'butterfly'], [el.omega, 'omega'], [el.rnetwork, 'rnetwork']]) {
      const active = effective === name;
      button.classList.toggle('active', active);
      button.setAttribute('aria-pressed', String(active));
    }
  }

  function updateStatus() {
    const layoutNames = {
      butterfly: 'reverse butterfly',
      omega: 'reverse omega',
      rnetwork: 'R-network',
      'local-collapse': 'locally collapsed',
      custom: 'custom dragged layout'
    };
    const layoutText = state.motion
      ? `moving ${layoutNames[state.motion.sourceLayout] || state.motion.sourceLayout} → ${layoutNames[state.motion.targetLayout]}${state.motion.cycles ? ` (cycle ${state.motion.cycleIndex + 1}/${state.motion.cycles.length})` : ''}`
      : (layoutNames[state.layout] || state.layout);
    const checks = state.carry.flat().filter(c => c.check).length;
    const totalChecks = state.n * state.N / 2;
    const fields = [
      `N=${state.N}`,
      `stages=${state.n}`,
      `layout=${layoutText}`,
      `auto=${state.auto.enabled ? (state.auto.reverts.size ? `${state.auto.reverts.size} temporary override${state.auto.reverts.size === 1 ? '' : 's'}` : 'on') : 'off'}`,
      `self-test=${state.diagnostics.ok ? 'PASS' : 'FAIL'}`
    ];
    if (el.checks.checked) fields.push(`checks=${checks}/${totalChecks}`);
    el.status.textContent = fields.join('  ·  ');
  }

  function applyLabels() {
    const labels = labelsForCurrentInput();
    for (let j = 0; j < state.N; j++) state.inputs[j].label = labels[j];
    recompute();
    render();
  }

  function setInputPattern(kind) {
    for (let j = 0; j < state.N; j++) {
      if (kind === 'all1') state.inputs[j].value = 1;
      else if (kind === 'all0') state.inputs[j].value = 0;
      else if (kind === 'alternating') state.inputs[j].value = (j % 2 === 0 ? 1 : 0);
      else if (kind === 'random') state.inputs[j].value = Math.random() < 0.5 ? 0 : 1;
    }
    recompute();
    if (state.auto.enabled) {
      clearAutoReverts();
      forceAutoConfig();
    }
    render();
  }

  function toggleAllInputs() {
    for (let j = 0; j < state.N; j++) {
      // Toggle only binary values. The third-state X is left unchanged.
      if (state.inputs[j].value === 0) state.inputs[j].value = 1;
      else if (state.inputs[j].value === 1) state.inputs[j].value = 0;
    }
    recompute();
    if (state.auto.enabled) {
      clearAutoReverts();
      forceAutoConfig();
    }
    render();
  }

  function toggleInput(j, manual = true) {
    if (j === 0) state.inputs[j].value = state.inputs[j].value === 1 ? 0 : (state.inputs[j].value === 0 ? 2 : 1);
    else state.inputs[j].value ^= 1;
    recompute();
    if (state.auto.enabled) {
      clearAutoReverts();
      forceAutoConfig();
    }
    render();
  }

  function togglePair(s, q, manual = true) {
    state.pairState[s][q] ^= 1;
    recompute();
    if (manual && state.auto.enabled) scheduleAutoRevert(s, q);
    render();
  }

  function setAllSwitches(mode) {
    disableAutoConfig();
    for (let s = 0; s < state.n; s++) {
      for (let q = 0; q < state.N / 2; q++) {
        if (mode === 'reset') state.pairState[s][q] = 0;
        else if (mode === 'toggle') state.pairState[s][q] ^= 1;
      }
    }
    recompute();
    render();
  }

  function svgPoint(event) {
    const p = el.svg.createSVGPoint();
    p.x = event.clientX;
    p.y = event.clientY;
    const matrix = el.svg.getScreenCTM();
    return matrix ? p.matrixTransform(matrix.inverse()) : { x: event.offsetX, y: event.offsetY };
  }

  function hitTestMovingSwitch(point) {
    if (!state.motion) return null;
    const g = geometry();
    const radius = g.r + 7;
    let best = null, bestDistance = radius;
    for (let s = state.n - 1; s >= 0; s--) {
      for (let j = state.N - 1; j >= 0; j--) {
        const d = dist(point, state.positions[s][j]);
        if (d <= bestDistance) { bestDistance = d; best = { s, j }; }
      }
    }
    return best;
  }

  el.svg.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    const point = svgPoint(event);
    const movingSwitch = hitTestMovingSwitch(point);
    const target = movingSwitch ? null : event.target.closest('.hit');
    if (!movingSwitch && !target) return;
    event.preventDefault();
    const type = movingSwitch ? 'switch' : target.dataset.type;
    el.svg.setPointerCapture(event.pointerId);

    if (type === 'switch') {
      if (state.motion) updateMotion(performance.now());
      state.motion = null;
      const s = movingSwitch ? movingSwitch.s : Number(target.dataset.s);
      const j = movingSwitch ? movingSwitch.j : Number(target.dataset.j);
      state.drag = {
        pointerId: event.pointerId,
        type, s, j,
        startPointer: point,
        startPosition: { ...state.positions[s][j] },
        moved: false
      };
    } else {
      state.drag = {
        pointerId: event.pointerId,
        type,
        j: target.dataset.j === undefined ? undefined : Number(target.dataset.j),
        s: target.dataset.s === undefined ? undefined : Number(target.dataset.s),
        q: target.dataset.q === undefined ? undefined : Number(target.dataset.q),
        startPointer: point,
        moved: false
      };
    }
  });

  el.svg.addEventListener('pointermove', event => {
    const drag = state.drag;
    if (!drag || drag.pointerId !== event.pointerId || drag.type !== 'switch') return;
    const point = svgPoint(event);
    const dx = point.x - drag.startPointer.x;
    const dy = point.y - drag.startPointer.y;
    if (!drag.moved && Math.hypot(dx, dy) > 3) drag.moved = true;
    if (!drag.moved) return;

    const proposed = { x: drag.startPosition.x + dx, y: drag.startPosition.y + dy };
    const mate = drag.j ^ (1 << drag.s);
    const matePosition = state.positions[drag.s][mate];
    const g = geometry();
    const centerDistance = dist(proposed, matePosition);
    const overlapFraction = (() => {
      if (centerDistance <= 0) return 1;
      if (centerDistance >= 2 * g.r) return 0;
      const ratio = centerDistance / (2 * g.r);
      const overlapArea = 2 * g.r * g.r * Math.acos(ratio) -
        0.5 * centerDistance * Math.sqrt(Math.max(0, 4 * g.r * g.r - centerDistance * centerDistance));
      return overlapArea / (Math.PI * g.r * g.r);
    })();
    if (overlapFraction >= 0.5) {
      proposed.x = matePosition.x;
      proposed.y = matePosition.y;
    }
    state.positions[drag.s][drag.j] = proposed;
    state.collapseSnapshot = null;
    state.layout = 'custom';
    render();
  });

  function finishPointer(event, cancelled = false) {
    const drag = state.drag;
    if (!drag || drag.pointerId !== event.pointerId) return;
    if (el.svg.hasPointerCapture(event.pointerId)) el.svg.releasePointerCapture(event.pointerId);
    state.drag = null;
    if (cancelled) return;

    if (drag.type === 'switch') {
      if (!drag.moved) {
        const physical = rotR(drag.j, drag.s, state.n);
        togglePair(drag.s, physical >> 1, true);
      } else {
        state.collapseSnapshot = null;
        state.layout = 'custom';
        render();
      }
    } else if (!drag.moved) {
      if (drag.type === 'input') toggleInput(drag.j, true);
      else if (drag.type === 'box') togglePair(drag.s, drag.q, true);
    }
  }

  el.svg.addEventListener('pointerup', event => finishPointer(event, false));
  el.svg.addEventListener('pointercancel', event => finishPointer(event, true));

  el.svg.addEventListener('keydown', event => {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    const target = event.target.closest('.hit');
    if (!target) return;
    event.preventDefault();
    const type = target.dataset.type;
    if (type === 'input') toggleInput(Number(target.dataset.j), true);
    else if (type === 'box') togglePair(Number(target.dataset.s), Number(target.dataset.q), true);
    else if (type === 'switch') {
      const s = Number(target.dataset.s);
      const j = Number(target.dataset.j);
      togglePair(s, rotR(j, s, state.n) >> 1, true);
    }
  });

  el.nSelect.addEventListener('change', () => resetNetwork(Number(el.nSelect.value)));
  el.generalizedShuffle.addEventListener('change', render);

  el.stageSpacing.addEventListener('input', () => {
    applyStageSpacing(el.stageSpacing.value);
  });
  el.speed.addEventListener('input', () => {
    state.speed = Number(el.speed.value);
  
  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 80);
  });

  el.speedValue.textContent = `${state.speed.toFixed(2)} positions/s`;
    updateStatus();
  });
  el.butterfly.addEventListener('click', () => startLayout('butterfly'));
  el.omega.addEventListener('click', () => startLayout('omega'));
  el.rnetwork.addEventListener('click', () => startLayout('rnetwork'));
  el.collapsePairs.addEventListener('click', toggleCollapsePairs);
  el.auto.addEventListener('change', () => setAutoConfig(el.auto.checked));
  el.inputsAll1.addEventListener('click', () => setInputPattern('all1'));
  el.inputsAll0.addEventListener('click', () => setInputPattern('all0'));
  el.inputsAlternating.addEventListener('click', () => setInputPattern('alternating'));
  el.inputsRandom.addEventListener('click', () => setInputPattern('random'));
  el.toggleAllInputs.addEventListener('click', toggleAllInputs);
  el.setSwitches.addEventListener('click', setSwitchesOnce);
  el.resetSwitches.addEventListener('click', () => setAllSwitches('reset'));
  el.toggleAllSwitches.addEventListener('click', () => setAllSwitches('toggle'));
  el.applyLabels.addEventListener('click', applyLabels);
  el.customLabels.addEventListener('keydown', event => {
    if (event.key === 'Enter') applyLabels();
  });
  el.boxes.addEventListener('change', () => startBoxAnimation(el.boxes.checked ? 1 : 0));
  for (const checkbox of [el.upper, el.lower, el.walls, el.stars, el.checks, el.switchLabels, el.shades, el.pairArcs]) {
    checkbox.addEventListener('change', () => render());
  }

  window.__reverseNetworkWidget = {
    getState() {
      return {
        N: state.N,
        n: state.n,
        speed: state.speed,
        stageSpacing: state.stageSpacing,
        layout: state.layout,
        movingTo: state.motion?.targetLayout ?? null,
        boxProgress: state.boxProgress,
        auto: { enabled: state.auto.enabled, reverts: Array.from(state.auto.reverts.entries()) },
        inputs: state.inputs.map(x => ({ ...x })),
        pairState: state.pairState.map(row => Array.from(row)),
        positions: state.positions.map(row => row.map(point => ({ ...point }))),
        outputs: state.layers[state.n].map(x => ({ ...x })),
        checks: state.carry.map(row => row.map(c => c.check)),
        diagnostics: { ...state.diagnostics, messages: [...state.diagnostics.messages] }
      };
    },
    diagnostics: () => ({ ...state.diagnostics, messages: [...state.diagnostics.messages] }),
    setN(N) {
      if (![8, 16, 32, 64].includes(N)) throw new RangeError('N must be 8, 16, 32, or 64');
      el.nSelect.value = String(N);
      resetNetwork(N);
    },
    setLayout: startLayout,
    toggleInput,
    togglePair,
    recompute() { recompute(); render(); },
    render
  };


  let resizeTimer = 0;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 80);
  });

  el.speedValue.textContent = `${state.speed.toFixed(2)} positions/s`;
  el.stageSpacingValue.textContent = `${state.stageSpacing} / 5`;
  resetNetwork(8);
})();
</script>
</body>
</html>
