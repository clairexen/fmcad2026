<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     width="2160" height="780" viewBox="0 0 2160 780"
     role="img" aria-labelledby="title desc">
  <title id="title">Three mental pictures for the family of three bit-permutation functions</title>
  <desc id="desc">Three aligned line-art panels. Sheep are routed identically to the right in every panel. Goats are routed right in panel one, routed left with reversed output order in panel two, and discarded while their output positions become zero in panel three.</desc>

  <defs>
    <style>
      .line {
        fill: none;
        stroke: #111;
        stroke-width: 3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .fine { stroke-width: 2.4; }
      .dashed { stroke-dasharray: 9 11; }
      .label {
        fill: #111;
        font-family: "DejaVu Serif", "Liberation Serif", serif;
        font-size: 24px;
      }
      .small-label {
        fill: #111;
        font-family: "DejaVu Serif", "Liberation Serif", serif;
        font-size: 20px;
      }
      .token {
        fill: #111;
        font-family: "DejaVu Serif", "Liberation Serif", serif;
        font-size: 27px;
        font-style: italic;
        text-anchor: middle;
      }
      .route-token {
        fill: #111;
        font-family: "DejaVu Serif", "Liberation Serif", serif;
        font-size: 22px;
        font-style: italic;
        text-anchor: middle;
      }
      .panel-number {
        fill: #111;
        font-family: "DejaVu Serif", "Liberation Serif", serif;
        font-size: 28px;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>

    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 11 6 L 0 12 z" fill="#111"/>
    </marker>

    <!-- One shared drawing is reused verbatim by all three panels. -->
    <g id="common-panel">
      <rect x="0" y="0" width="700" height="760" fill="#fff"/>

      <!-- Output-area labels and overbraces. -->
      <text class="small-label" x="200" y="74" text-anchor="middle">Goat-only</text>
      <text class="small-label" x="200" y="98" text-anchor="middle">parking</text>
      <path class="line fine"
            d="M110 137 C110 124 118 119 132 119 H176 C190 119 196 110 200 101 C204 110 210 119 224 119 H268 C282 119 290 124 290 137"/>

      <text class="small-label" x="460" y="74" text-anchor="middle">Sheep-only</text>
      <text class="small-label" x="460" y="98" text-anchor="middle">parking</text>
      <path class="line fine"
            d="M310 137 C310 124 318 119 332 119 H436 C450 119 456 110 460 101 C464 110 470 119 484 119 H588 C602 119 610 124 610 137"/>

      <!-- Open-bottom output slots, matching the comb-like line in the sketch. -->
      <path class="line" d="M110 151 H290 M310 151 H610"/>
      <path class="line fine" d="M110 151 V207 M170 151 V207 M230 151 V207 M290 151 V207"/>
      <path class="line fine" d="M310 151 V207 M370 151 V207 M430 151 V207 M490 151 V207 M550 151 V207 M610 151 V207"/>

      <text class="label" x="54" y="176" text-anchor="middle">MSB</text>
      <text class="label" x="654" y="176" text-anchor="middle">LSB</text>

      <!-- Sheep output and traversal: exactly the same reused geometry in I, II, III. -->
      <text class="token" x="340" y="193">S₅</text>
      <text class="token" x="400" y="193">S₄</text>
      <text class="token" x="460" y="193">S₃</text>
      <text class="token" x="520" y="193">S₂</text>
      <text class="token" x="580" y="193">S₁</text>
      <path class="line" d="M310 229 H602" marker-end="url(#arrow)"/>

      <!-- Sheep approach to the midpoint and its LSB-first queue. -->
      <path class="line"
            d="M300 431 C322 405 351 365 354 321 C357 277 322 254 310 229"/>
      <text class="route-token" x="350" y="410">S₅</text>
      <text class="route-token" x="367" y="378">S₄</text>
      <text class="route-token" x="380" y="345">S₃</text>
      <text class="route-token" x="382" y="311">S₂</text>
      <text class="route-token" x="368" y="277">S₁</text>

      <!-- Common incoming route and original bit order. -->
      <path class="line" d="M48 698 L300 431"/>
      <text class="route-token" x="65" y="710">S₅</text>
      <text class="route-token" x="96" y="677">G₃</text>
      <text class="route-token" x="127" y="644">S₄</text>
      <text class="route-token" x="158" y="611">S₃</text>
      <text class="route-token" x="189" y="578">S₂</text>
      <text class="route-token" x="220" y="545">G₂</text>
      <text class="route-token" x="251" y="512">G₁</text>
      <text class="route-token" x="282" y="479">S₁</text>

      <!-- The small shepherd figure from the sketch. -->
      <circle class="line fine" cx="361" cy="442" r="9"/>
      <path class="line fine" d="M361 451 V482 M347 463 H375 M361 482 L347 505 M361 482 L377 505"/>
    </g>
  </defs>

  <!-- Panel I: sheep and goats (SAG). -->
  <g transform="translate(10 10)">
    <use xlink:href="#common-panel"/>
    <circle class="line fine" cx="48" cy="48" r="30"/>
    <text class="panel-number" x="48" y="48">I</text>

    <text class="token" x="140" y="193">G₃</text>
    <text class="token" x="200" y="193">G₂</text>
    <text class="token" x="260" y="193">G₁</text>
    <path class="line" d="M110 229 H282" marker-end="url(#arrow)"/>

    <path class="line"
          d="M300 431 C270 398 239 356 203 311 C170 270 126 254 110 229"/>
    <text class="route-token" x="248" y="405">G₃</text>
    <text class="route-token" x="215" y="365">G₂</text>
    <text class="route-token" x="181" y="325">G₁</text>
  </g>

  <!-- Panel II: witches and wizards (WAW), reversed goat order. -->
  <g transform="translate(730 10)">
    <use xlink:href="#common-panel"/>
    <circle class="line fine" cx="48" cy="48" r="30"/>
    <text class="panel-number" x="48" y="48">II</text>

    <text class="token" x="140" y="193">G₁</text>
    <text class="token" x="200" y="193">G₂</text>
    <text class="token" x="260" y="193">G₃</text>
    <path class="line" d="M290 229 H118" marker-end="url(#arrow)"/>

    <path class="line"
          d="M300 431 C286 397 279 356 281 315 C283 274 291 249 290 229"/>
    <text class="route-token" x="263" y="397">G₃</text>
    <text class="route-token" x="257" y="350">G₂</text>
    <text class="route-token" x="260" y="302">G₁</text>
  </g>

  <!-- Panel III: parallel extract (PEXT), goats discarded and cleared. -->
  <g transform="translate(1450 10)">
    <use xlink:href="#common-panel"/>
    <circle class="line fine" cx="48" cy="48" r="30"/>
    <text class="panel-number" x="48" y="48">III</text>

    <text class="token" x="140" y="193">0</text>
    <text class="token" x="200" y="193">0</text>
    <text class="token" x="260" y="193">0</text>
    <path class="line fine dashed" d="M110 229 H290"/>

    <path class="line"
          d="M300 431 C275 399 248 367 217 333" marker-end="url(#arrow)"/>
    <text class="token" x="241" y="386">G₁</text>
    <text class="token" x="265" y="331">G₂</text>
    <text class="token" x="211" y="293">G₃</text>
  </g>
</svg>
